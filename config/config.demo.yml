# =============================================================================
# config/config.demo.yml —— 合成数据配置（仅用于跑通流程，不能用于科学结论）
# 用法：Rscript run_all.R --demo
# =============================================================================

project:
  name: "glaucoma_AFO_demo"
  seed: 20261101
  outdir: "results_demo"
  fig_width: 7
  fig_height: 5
  dpi: 200
  log_dir: "logs"

bulk:
  train:
    gse: "DEMO"
    gpl: "SYNTHETIC"
    group_regex: "DEMO"        # demo 的 pheno 已有 group 列，01 会直接用
    batch: "batch"
  valid:
    - gse: "DEMO_V"
      gpl: "SYNTHETIC"
      group_regex: "DEMO"
  qc:
    min_expr_quantile: 0.25
    log2_if_max_below: 50
    normalize_method: "quantile"
    combat: true
    auto_remove_outliers: false
    outlier_sd: 3
  deg:
    fdr: 0.05
    logfc: 1.0
    min_samples_expr: 0.5
  wgcna:
    soft_power: 6
    min_module_size: 30
    merge_cut_height: 0.25
    deep_split: 2
    network_type: "signed"
    tom_type: "signed"
    traits_numeric: ["IOP", "MD"]
    traits_binary: ["group"]
  enrich:
    p_cut: 0.05
    q_cut: 0.2
    msigdb_category: "H"
    # msigdbr 首次运行要从 zenodo 下载 ~37MB 基因集，demo 在无网络环境下会卡十几分钟；
    # 只影响 GSVA/GSEA（Hallmark），关掉后 ORA 与反卷积照常
    msigdb: false
  deconv:
    method: "nnls"
    signature_cells: ["TM", "JCT"]
    min_expr: 0.5
    max_genes_per_celltype: 300
  ml:
    lasso_lambda: "lambda.min"
    lasso_folds: 5
    svm_rfe_subsets: [3, 5, 8, 12, 20]
    rf_ntree: 300
    use_boruta: false
    bootstrap: 500          # Harrell optimism 重抽次数（demo 样本小，500 足够）

scrna:
  mode: "rds"
  rds: "none"
  tenx_dirs: []
  group_regex: "DEMO"
  resolution: 0.6
  qc: {min_features: 200, max_features: 8000, max_mt: 20}
  tm_celltypes: ["TM", "JCT"]

genetics:
  gwas:
    path: "data/raw/demo_gwas.tsv.gz"
    sep: "\t"
    cols:
      snp: "rsids"
      beta: "beta"
      se: "sebeta"
      pval: "pval"
      ea: "alt"
      nea: "ref"
      eaf: "af_alt"
      "n": "N"   # 键必须加引号：YAML 1.1 会把裸 n 解析成布尔 FALSE
    info_min: 0.8
    type: "quant"              # demo 的 beta 是连续性状尺度
    case_prop: 0.3
    n_default: 300000
    maf_min: 0.01
    n_min: 1000
    build: "hg38"
  ld:
    panel_plink: "data/raw/1000G_EUR_Phase3_plink/1000G.EUR.QC"
    ldsc_dir: "tools/ldsc"
    python: "python"
  eqtl:
    source: "local_tsv"
    local_tsv: "data/raw/demo_eqtl.tsv.gz"
    tissues: ["Artery"]
    n_eqtl: 300
    window_kb: 500
    gtex_dir: "data/raw/GTEx_v8"
  coloc:
    p1: 1e-4
    p2: 1e-4
    p12: 1e-5
    pp4_threshold: 0.8
  twas:
    fusion_dir: "tools/FUSION"
    weights_dir: "data/raw/FUSION_weights"
  mr:
    exposure: "data/raw/demo_mr_exposure.tsv.gz"
    p_threshold: 5e-8
    clump_r2: 0.001
    clump_kb: 10           # demo 每 500bp 一个 SNP，需要 10 kb 才能留下多个工具变量
    f_stat_min: 10
    methods: ["mr_ivw", "mr_egger_regression", "mr_weighted_median"]
    nboot_presso: 1000

run:
  # 06/09/11/12/14 依赖单细胞对象、FUSION 权重、IOP GWAS 与跨物种数据，demo 里没有；
  # 列进来只会白跑一遍再跳过，所以不列，missing_steps.tsv 会如实标出它们缺什么
  steps: ["01", "02", "03", "04", "05", "07", "08", "10", "13", "15", "16", "17"]
  demo: true
  overwrite: true
